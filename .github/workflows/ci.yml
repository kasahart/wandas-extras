name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Weekly, so a new wandas / numpy / scipy release that breaks this package shows up without a PR.
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
        wandas: [latest]
        include:
          # The oldest wandas that pyproject.toml allows.
          - python-version: "3.10"
            wandas: lowest
    name: test (Python ${{ matrix.python-version }}, wandas ${{ matrix.wandas }})
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv python install ${{ matrix.python-version }}
      - run: uv sync --group test --python ${{ matrix.python-version }}
      - name: Install the oldest allowed wandas
        if: matrix.wandas == 'lowest'
        run: |
          floor=$(sed -n 's/^ *"wandas>=\([0-9.]*\)",$/\1/p' pyproject.toml)
          test -n "$floor" || { echo "::error::no 'wandas>=X' line in pyproject.toml dependencies; keep the floor in that form"; exit 1; }
          uv pip install "wandas==$floor"
      - run: uv run --no-sync python -c "import wandas; print('wandas', wandas.__version__)"
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync ruff format --check .
      - run: uv run --no-sync ty check src tests
      - run: uv run --no-sync pytest -q
